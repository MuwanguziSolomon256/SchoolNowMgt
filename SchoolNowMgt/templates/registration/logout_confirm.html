<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Logout</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
            background: rgba(10, 17, 61, 0.2);
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overlay {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 17, 61, 0.16);
            padding: 24px;
        }
        .modal-container {
            width: min(520px, 100%);
            background: linear-gradient(135deg, #ffffff 0%, #f6f8ff 100%);
            border: 1px solid rgba(10,17,61,0.08);
            border-radius: 16px;
            box-shadow: 0 22px 54px rgba(10, 17, 61, 0.18);
            padding: 20px 20px 18px;
            backdrop-filter: blur(8px);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 4px 6px;
        }
        .modal-header .title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a1b26;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .close-button {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(10,17,61,0.12);
            background: #fff;
            color: #0a113d;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .modal-body {
            padding: 12px 6px 20px;
            text-align: center;
            font-size: 1.08rem;
            color: #0f162f;
        }
        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }
        form {
            margin: 0;
        }
        button[type="submit"],
        .btn-cancel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            min-height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(10,17,61,0.18);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            text-decoration: none;
        }
        button[type="submit"] {
            background: #0a113d;
            color: #fff;
            border-color: #0a113d;
        }
        .btn-cancel {
            background: #fff;
            color: #0a113d;
        }
        button[type="submit"]:hover,
        .btn-cancel:hover {
            transform: translateY(-1px);
        }
        @media (max-width: 540px) {
            .modal-actions {
                flex-direction: column;
            }
            button[type="submit"], .btn-cancel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="title">Logout</div>
                <button class="close-button" type="button" aria-label="Close" onclick="window.history.back()">×</button>
            </div>

            <div class="modal-body">
                Are you sure you want to log out?
            </div>

            <div class="modal-actions">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit">OK</button>
                </form>
                <a href="{% url 'teacher:support_staff:shift_supervisor_dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </div>
    </div>
</body>
</html>
