<!-- Replica of the support staff screenshot-style navbar -->
<nav class="support-nav" aria-label="Shift supervisor navigation">
    <div class="support-nav__inner">
        <div class="support-nav__logo-group">
            <a class="support-nav__brand" href="{% url 'teacher:support_staff:shift_supervisor_dashboard' %}" aria-label="SchoolNow dashboard">
                <span class="material-symbols-outlined">school</span>
            </a>
        </div>
        <!-- greeting and shift status removed from navbar; moved below navbar in page templates -->

        <div class="support-nav__links" id="support-nav-links">
            <a class="support-nav__link {% if request.resolver_match.url_name == 'shift_supervisor_dashboard' %}active{% endif %}" href="{% url 'teacher:support_staff:shift_supervisor_dashboard' %}">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a class="support-nav__link {% if request.resolver_match.url_name == 'staff_roster_dashboard' %}active{% endif %}" href="{% url 'teacher:support_staff:staff_roster_dashboard' %}">
                <span class="material-symbols-outlined">groups</span>
                <span>Staff</span>
            </a>
            <a class="support-nav__link {% if request.resolver_match.url_name == 'messages_dashboard' %}active{% endif %}" href="{% url 'teacher:support_staff:messages_dashboard' %}">
                <span class="material-symbols-outlined">mail</span>
                <span>Messages</span>
            </a>
            <a class="support-nav__link {% if request.resolver_match.url_name == 'shift_attendance_list' %}active{% endif %}" href="{% url 'teacher:support_staff:shift_attendance_list' %}">
                <span class="material-symbols-outlined">calendar_month</span>
                <span>Attendance</span>
            </a>
            <a class="support-nav__link {% if request.resolver_match.url_name == 'payments_dashboard' %}active{% endif %}" href="{% url 'teacher:support_staff:payments_dashboard' %}">
                <span class="material-symbols-outlined">payments</span>
                <span>Payments</span>
            </a>
        </div>

        <div class="support-nav__actions">
            <a class="support-nav__logout" href="{% url 'SchoolNowMgt:custom_logout' %}">
                <span class="material-symbols-outlined">logout</span>
                <span>Log out</span>
            </a>
            <button id="shiftSupervisorMobileToggle" type="button" class="support-nav__mobile-toggle lg:hidden" aria-expanded="false" aria-controls="support-nav-links">
                <span class="material-symbols-outlined">menu</span>
                <span>Menu</span>
            </button>
        </div>
    </div>
</nav>

<script>
(function() {
    const toggle = document.getElementById('shiftSupervisorMobileToggle');
    const nav = document.querySelector('.support-nav');
    const links = document.getElementById('support-nav-links');

    if (toggle && nav && links) {
        toggle.addEventListener('click', function () {
            const expanded = toggle.getAttribute('aria-expanded') === 'true';
            toggle.setAttribute('aria-expanded', String(!expanded));
            nav.classList.toggle('mobile-open', !expanded);
        });

            window.addEventListener('resize', function () {
            if (window.innerWidth >= 768) {
                nav.classList.remove('mobile-open');
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    }
})();
</script>
