{% load static %}
<link rel="stylesheet" href="{% static 'css/deputy_theme.css' %}">
<style>
  body { padding-top: 84px !important; }
  /* Inline overrides to ensure immediate visual updates */
  nav.snm-navbar { background: linear-gradient(180deg,#080b3a 0%, #1e224f 100%) !important; }
  nav.snm-navbar-mobile { background: linear-gradient(180deg,#080b3a 0%, #1e224f 100%) !important; }
  #deputyMobileMenu { background: linear-gradient(180deg,#080b3a 0%, #1e224f 100%) !important; border-color: #080b3a !important; }
  nav.snm-navbar .snm-brand-icon { background: #feb700 !important; color: #080b3a !important; }
  nav.snm-navbar a, nav.snm-navbar a * { color: #ffffff !important; }
  nav.snm-navbar a:hover, nav.snm-navbar a:focus { color: #ffffff !important; background: rgba(255,255,255,0.03) !important; }
  nav.snm-navbar a.active, nav.snm-navbar a.active * { color: #080b3a !important; background: #feb700 !important; border-radius: 10px; box-shadow: 0 10px 15px -3px rgba(254,183,0,0.3) !important; }
  nav.snm-navbar a.active .material-symbols-outlined, nav.snm-navbar a.active span { color: #080b3a !important; }
  #deputyMobileMenu a { color: #ffffff !important; }
  #deputyMobileMenu a:hover, #deputyMobileMenu a:focus { color: #ffffff !important; background: rgba(255,255,255,0.1) !important; }
  #deputyMobileMenu a.active, #deputyMobileMenu a.active * { color: #080b3a !important; background: #feb700 !important; }
  /* ensure export/logout buttons appear white */
  nav.snm-navbar .snm-btn-ghost, nav.snm-navbar .snm-btn-ghost * { color: #ffffff !important; }
</style>

<!-- Top Navigation Bar for Deputy HM -->
<nav class="snm-navbar hidden md:flex items-center justify-between bg-[#080b3a] text-white px-6 py-3 fixed top-0 left-0 right-0 z-50 shadow-lg gap-4">
  <div class="flex items-center gap-3">
    <div class="brand-icon-repl w-10 h-10 rounded-2xl bg-[#feb700] flex items-center justify-center text-[#080b3a] flex-shrink-0 shadow-[0_8px_24px_rgba(11,21,51,0.18)]" aria-hidden="true">
      <span class="material-symbols-outlined text-lg sm:text-xl" style="font-variation-settings: 'FILL' 1;">school</span>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <a href="{% url 'SchoolNowMgt:deputy_hm:dashboard' %}" class="rounded-lg font-semibold px-3 py-2 flex items-center gap-2 transition-all text-sm {% if active_nav == 'dashboard' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:text-white hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">dashboard</span>
      <span>Dashboard</span>
    </a>
    <a href="{% url 'SchoolNowMgt:deputy_hm:support_staff_list' %}" class="rounded-lg font-semibold px-3 py-2 flex items-center gap-2 transition-all text-sm {% if active_nav == 'staff' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:text-white hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">group</span>
      <span>Staff Tracking</span>
    </a>
    <a href="{% url 'SchoolNowMgt:deputy_hm:discipline_log' %}" class="rounded-lg font-semibold px-3 py-2 flex items-center gap-2 transition-all text-sm {% if active_nav == 'discipline' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:text-white hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">report</span>
      <span>Discipline Log</span>
    </a>
    <a href="{% url 'SchoolNowMgt:deputy_hm:governance_dashboard' %}" class="rounded-lg font-semibold px-3 py-2 flex items-center gap-2 transition-all text-sm {% if active_nav == 'governance' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:text-white hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">gavel</span>
      <span>Governance</span>
    </a>
  </div>

  <div class="flex items-center gap-3">
    <form method="post" action="{% url 'SchoolNowMgt:custom_logout' %}" class="inline">
      {% csrf_token %}
      <button type="submit" class="snm-btn-ghost flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold" title="Logout" onclick="return confirm('Are you sure you want to log out?');">
        <span class="material-symbols-outlined text-base">logout</span>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </form>
  </div>
</nav>

<!-- Mobile navigation (visible on small screens) -->
<nav class="snm-navbar-mobile md:hidden flex items-center justify-between bg-primary text-white px-4 py-3 fixed top-0 left-0 right-0 z-50 shadow-lg">
  <div class="flex items-center gap-3">
    <div class="brand-icon-repl w-10 h-10 rounded-2xl bg-[#feb700] flex items-center justify-center text-primary flex-shrink-0 shadow-[0_8px_24px_rgba(11,21,51,0.18)]" aria-hidden="true">
      <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1; color: #080b3a;">school</span>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <form method="post" action="{% url 'SchoolNowMgt:custom_logout' %}" class="inline hidden sm:inline">
      {% csrf_token %}
      <button type="submit" class="text-white hover:text-white p-2 rounded-lg transition-colors flex items-center gap-2" title="Logout" onclick="return confirm('Are you sure you want to log out?');">
        <span class="material-symbols-outlined">logout</span>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </form>
    <button id="deputyMobileMenuToggle" class="text-white hover:text-white p-2 rounded-lg transition-colors" aria-expanded="false" aria-controls="deputyMobileMenu" aria-label="Open menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </div>
</nav>

<div id="deputyMobileMenu" class="hidden md:hidden fixed top-16 left-0 right-0 bg-[#080b3a] text-white z-40 max-h-0 overflow-hidden transition-all duration-300 ease-in-out shadow-lg border-b border-[#080b3a]">
  <div class="p-4 space-y-2">
    <a href="{% url 'SchoolNowMgt:deputy_hm:dashboard' %}" class="rounded-lg font-semibold px-4 py-3 flex items-center gap-3 transition-all text-sm {% if active_nav == 'dashboard' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">dashboard</span>
      <span>Dashboard</span>
    </a>
    <a href="{% url 'SchoolNowMgt:deputy_hm:support_staff_list' %}" class="rounded-lg font-semibold px-4 py-3 flex items-center gap-3 transition-all text-sm {% if active_nav == 'staff' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">group</span>
      <span>Staff Tracking</span>
    </a>
    <a href="{% url 'SchoolNowMgt:deputy_hm:discipline_log' %}" class="rounded-lg font-semibold px-4 py-3 flex items-center gap-3 transition-all text-sm {% if active_nav == 'discipline' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">report</span>
      <span>Discipline Log</span>
    </a>
    <a href="{% url 'SchoolNowMgt:deputy_hm:governance_dashboard' %}" class="rounded-lg font-semibold px-4 py-3 flex items-center gap-3 transition-all text-sm {% if active_nav == 'governance' %}bg-[#feb700] text-[#080b3a]{% else %}text-white/90 hover:bg-white/10{% endif %}">
      <span class="material-symbols-outlined text-base">gavel</span>
      <span>Governance</span>
    </a>
    <form method="post" action="{% url 'SchoolNowMgt:custom_logout' %}" class="inline">
      {% csrf_token %}
      <button type="submit" class="w-full text-left rounded-lg font-semibold px-4 py-3 flex items-center gap-3 text-white/90 hover:bg-white/10 transition-all" title="Logout" onclick="return confirm('Are you sure you want to log out?');">
        <span class="material-symbols-outlined text-base">logout</span>
        <span>Logout</span>
      </button>
    </form>
  </div>
</div>

<script>
  (function(){
    const btn = document.getElementById('deputyMobileMenuToggle');
    const menu = document.getElementById('deputyMobileMenu');
    if (!btn || !menu) return;
    btn.addEventListener('click', ()=>{
      const isHidden = menu.classList.contains('hidden');
      if (isHidden) {
        menu.classList.remove('hidden');
        menu.style.maxHeight = menu.scrollHeight + 'px';
        btn.setAttribute('aria-expanded', 'true');
      } else {
        menu.style.maxHeight = '0px';
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('click', (e)=>{
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        menu.style.maxHeight = '0px';
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    document.querySelectorAll('#deputyMobileMenu a, #deputyMobileMenu button').forEach(item => {
      item.addEventListener('click', ()=>{
        menu.style.maxHeight = '0px';
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
