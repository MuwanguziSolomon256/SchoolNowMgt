<header class="h-20 sticky top-0 w-full bg-white/70 backdrop-blur-[20px] shadow-sm flex flex-col z-50 border-b border-white/20">
  <div class="h-16 flex items-center justify-between px-8">
    <div class="flex items-center gap-8">
      <div class="flex flex-col">
        <h1 class="font-headline-md text-xl font-bold text-primary leading-none">SchoolNow</h1>
        <p class="text-[10px] font-label-md text-on-surface-variant/60 tracking-wider uppercase">Ethos Management</p>
      </div>
      <nav class="hidden lg:flex items-center gap-8 h-full">
        <a class="{% if active_nav == 'dashboard' %}text-primary font-bold{% else %}text-on-surface-variant/80 hover:text-primary{% endif %}" href="{% url 'SchoolNowMgt:deputy_hm:dashboard' %}">Dashboard</a>
        <a class="{% if active_nav == 'staff' %}text-primary font-bold{% else %}text-on-surface-variant/80 hover:text-primary{% endif %}" href="{% url 'SchoolNowMgt:deputy_hm:support_staff_list' %}">Staff Tracking</a>
        <a class="{% if active_nav == 'discipline' %}text-primary font-bold{% else %}text-on-surface-variant/80 hover:text-primary{% endif %}" href="{% url 'SchoolNowMgt:deputy_hm:discipline_log' %}">Discipline Log</a>
        <a class="{% if active_nav == 'governance' %}text-primary font-bold{% else %}text-on-surface-variant/80 hover:text-primary{% endif %}" href="{% url 'SchoolNowMgt:deputy_hm:governance_dashboard' %}">Governance</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <a href="{% url 'SchoolNowMgt:deputy_hm:profile' %}" class="flex items-center gap-3 ml-2 border-l border-white/30 pl-4 hover:bg-white/40 rounded-full pr-3 py-1 transition-all">
        <div class="text-right hidden sm:block">
          <p class="text-sm font-bold text-primary leading-tight">{{ staff_profile.user.get_full_name|default:request.user.get_full_name }}</p>
          <p class="text-[10px] text-on-surface-variant leading-tight">Deputy Headteacher</p>
        </div>
        <div class="w-10 h-10 rounded-full border-2 border-white shadow-sm overflow-hidden bg-primary-container flex items-center justify-center text-sm font-bold text-white">
          {{ staff_profile.user.first_name|first|default:"D" }}{{ staff_profile.user.last_name|first|default:"H" }}
        </div>
      </a>
      <form method="post" action="{% url 'SchoolNowMgt:custom_logout' %}" class="flex items-center">
        {% csrf_token %}
        <button type="submit" class="flex items-center gap-2 rounded-full border border-white/40 bg-white/60 px-3 py-2 text-sm font-semibold text-primary hover:bg-white/80 transition-all" title="Logout">
          <span class="material-symbols-outlined text-base">logout</span>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </form>
    </div>
  </div>
</header>
