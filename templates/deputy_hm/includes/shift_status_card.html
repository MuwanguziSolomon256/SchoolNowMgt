{% load static %}

<div class="px-container-padding pb-6">
    <div id="shiftCard" class="rounded-[2rem] deputy-status-card px-6 py-6 md:px-8 md:py-7 shadow-[0_24px_80px_-40px_rgba(8,11,58,0.5)] border-white/10 w-full" style="background: linear-gradient(180deg, var(--nav-start) 0%, var(--nav-end) 100%) !important;">
        <div class="flex flex-col md:flex-row items-center justify-between gap-5">
            <div class="flex items-center gap-3 min-w-0">
                <div class="flex h-16 w-16 items-center justify-center rounded-[1.75rem] bg-[#060a3a] shadow-xl shadow-black/30">
                    <span class="material-symbols-outlined text-3xl text-[#FFC300]">schedule</span>
                </div>
                <div class="min-w-0">
                    <p class="text-xs uppercase tracking-[0.32em] text-slate-400 mb-2">Shift Status</p>
                    <h2 id="shiftStatusText" class="text-2xl md:text-3xl font-black text-white leading-tight truncate">{% if is_on_duty %}Active since {{ shift_start_time|time:"h:i A" }}{% else %}Not on Duty{% endif %}</h2>
                    <div class="mt-3 flex items-center gap-3 text-sm text-slate-300">
                        <span id="shiftStatusDot" class="inline-flex h-2.5 w-2.5 rounded-full {% if is_on_duty %}bg-emerald-400{% else %}bg-rose-500{% endif %}"></span>
                        <span id="shiftStatusSubtitle" class="uppercase tracking-[0.18em] font-semibold text-slate-200">{% if is_on_duty %}ON DUTY{% else %}OFF DUTY{% endif %} - {{ today|date:"l" }}</span>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-3 mt-4 md:mt-0 justify-end">
                <button id="clockInOutBtn" type="button" data-action="{% if is_on_duty %}clock-out{% else %}clock-in{% endif %}" class="inline-flex items-center gap-2 rounded-full bg-[#FFC300] px-6 py-3 text-sm font-semibold text-[#080b3a] transition hover:bg-[#ffb600] shadow-lg shadow-[#ffb600]/20">
                    <span class="material-symbols-outlined">{% if is_on_duty %}logout{% else %}login{% endif %}</span>
                    <span>{% if is_on_duty %}Clock Out{% else %}Clock In{% endif %}</span>
                </button>
                <button id="breakBtn" type="button" data-action="{% if is_on_break %}break-end{% else %}break-start{% endif %}" {% if not is_on_duty %}disabled{% endif %} class="inline-flex items-center gap-2 rounded-full bg-white px-6 py-3 text-sm font-semibold text-[#080b3a] transition hover:bg-slate-100 shadow-lg shadow-black/10 {% if is_on_break %}break-active{% endif %}">
                    <span class="material-symbols-outlined">{% if is_on_break %}stop_circle{% else %}coffee{% endif %}</span>
                    <span>{% if is_on_break %}End Break{% else %}Break{% endif %}</span>
                </button>
            </div>
        </div>
    </div>
</div>
